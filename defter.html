<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="atolye-repo" content="alicetinkaya76/llm-atolyesi">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atölye Defteri</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atölye">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./ikon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./stil.css">
<style>
  .ozet { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.55rem; margin: 1rem 0; }
  .ozet .k { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0.55rem 0.8rem; }
  .ozet .v { font-family: "IBM Plex Mono", monospace; font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ozet .l { font-size: 0.74rem; color: var(--muted); }

  .arac { display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: center; margin: 0.9rem 0; }
  .dugme {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 650; font-size: 0.85rem;
    background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
    padding: 0.42rem 0.85rem; cursor: pointer;
  }
  .dugme:hover { background: var(--accent-ink); }
  .dugme.ikincil { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .dugme.ikincil:hover { border-color: var(--accent); }
  .dugme:disabled { opacity: 0.45; cursor: default; }
  .dugme:focus-visible, .lvls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ipucu { font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; color: var(--muted); }
  kbd {
    font-family: "IBM Plex Mono", monospace; font-size: 0.72em; background: var(--code-bg);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0.05em 0.35em;
  }

  /* faz kartları */
  .pcard { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 0 12px 12px 0; margin: 0.9rem 0; overflow: hidden; }
  .phead { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0.95rem; cursor: pointer; user-select: none; }
  .phead:hover { background: var(--surface-2); }
  .phead .tag { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.06em; padding: 0.15em 0.55em; border-radius: 999px; background: var(--pc); color: #fff; flex-shrink: 0; }
  .phead .tag.inkdark { color: var(--badge-ink-dark); }
  .phead .nm { font-family: "Bricolage Grotesque", sans-serif; font-weight: 650; font-size: 0.98rem; flex: 1; min-width: 7rem; }
  .phead .plan { font-family: "IBM Plex Mono", monospace; font-size: 0.64rem; color: var(--muted); text-decoration: none; }
  .phead .plan:hover { color: var(--accent); }
  .kanit {
    font-family: "IBM Plex Mono", monospace; font-size: 0.62rem;
    color: var(--muted); text-decoration: none; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 999px; padding: 0.1em 0.5em;
  }
  .kanit:hover { border-color: var(--accent); color: var(--accent); }
  .kanit.var { border-color: var(--ok); color: var(--ok); }
  .kanit.acik { border-color: var(--warn); color: var(--warn); }
  /* "bakılmadı" kesik çizgili ve sönük; "iskelet" normal çerçeveli ama
     nötr — ikisi karışırsa kanıt katmanı yalan söyler */
  .kanit.bakilmadi { opacity: 0.45; border-style: dashed; }
  .kanit.iskelet { opacity: 0.75; }
  .gate { font-family: "IBM Plex Mono", monospace; font-size: 0.63rem; padding: 0.18em 0.55em; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .gate.on { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .gate.run { border-color: var(--warn); color: var(--warn); }
  .ppct { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chev { color: var(--muted); font-size: 0.75rem; }
  .pcard.acik .chev { transform: rotate(90deg); }
  .pbody { display: none; border-top: 1px solid var(--line); }
  .pcard.acik .pbody { display: block; }

  .item { padding: 0.6rem 0.95rem; border-bottom: 1px solid var(--line); scroll-margin-top: 4rem; }
  .item:last-child { border-bottom: none; }
  .item.odak { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
  .item.vurgu { animation: vurgula 1.6s ease-out; }
  @keyframes vurgula { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
  .item .row { display: flex; align-items: baseline; gap: 0.55rem; flex-wrap: wrap; }
  .item .lbl { flex: 1; min-width: 11rem; font-size: 0.93rem; }
  .item .kid {
    font-family: "IBM Plex Mono", monospace; font-size: 0.62rem;
    color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--line);
  }
  .item .kid:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .item .core { font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 0 0.28em; }
  .item .hint { font-size: 0.8rem; color: var(--muted); margin: 0.12rem 0 0.25rem; }
  .lvls { display: flex; gap: 0.22rem; }
  .lvls button {
    font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; font-weight: 600;
    width: 1.7rem; height: 1.5rem; border-radius: 5px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--muted); cursor: pointer; padding: 0;
  }
  .lvls button:hover { border-color: var(--pc); }
  .lvls button.hit { background: var(--pc); border-color: var(--pc); color: #fff; }
  .lvls button.hit.inkdark { color: var(--badge-ink-dark); }
  .lvlname { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; color: var(--muted); margin-top: 0.2rem; }
  .tazelik.soluyor { color: var(--muted); }
  .tazelik.yarilanma { color: var(--warn); }
  .tazele-dugme {
    font-family: "IBM Plex Mono", monospace; font-size: 0.6rem;
    margin-left: 0.5rem; padding: 0.15em 0.55em; border-radius: 999px;
    border: 1px solid var(--warn); background: transparent; color: var(--warn); cursor: pointer;
  }
  .tazele-dugme:hover { background: var(--warn); color: var(--bg); }
  .tazele-dugme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* günlük */
  .jform { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem 1.05rem; }
  .jgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 0.55rem; margin-bottom: 0.55rem; }
  .jform label { display: block; font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.15rem; }
  .jform input, .jform select, .jform textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--bg);
    color: var(--text); font-family: "Source Serif 4", Georgia, serif; font-size: 0.92rem; padding: 0.42rem 0.55rem;
  }
  .jform textarea { min-height: 2.5rem; resize: vertical; }
  .jform input:focus, .jform select:focus, .jform textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .jentry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.9rem; margin: 0.5rem 0; }
  .jentry .top { display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
  .jentry .d { font-family: "IBM Plex Mono", monospace; font-size: 0.73rem; font-weight: 600; }
  .jentry .h { font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; color: var(--muted); }
  .jentry .del {
    margin-left: auto; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 0.82rem;
    /* WCAG 2.5.8: en az 24×24 dokunma alanı — tek yıkıcı denetim bu */
    min-width: 1.6rem; min-height: 1.6rem; border-radius: 6px; line-height: 1;
  }
  .jentry .del:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .jentry .del:hover { color: var(--warn); }
  .jentry dt { font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 0.25rem; }
  .jentry dd { margin: 0; font-size: 0.9rem; }
  .jentry dl { margin: 0.25rem 0 0; }

  /* kayıt çubuğu */
  .kayitbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 0.55rem 1rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
    display: none; align-items: center; gap: 0.6rem; justify-content: center; flex-wrap: wrap;
  }
  .kayitbar.gorunur { display: flex; }
  .kayitbar .msg { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; color: var(--warn); }
  .kayitbar .msg.iyi { color: var(--ok); }

  /* komut paleti */
  .perde { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 90; display: none; }
  .perde.acik { display: block; }
  .palet {
    position: fixed; z-index: 91; left: 50%; top: 12vh; transform: translateX(-50%);
    width: min(34rem, 92vw); background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,0.3); display: none; overflow: hidden;
  }
  .palet.acik { display: block; }
  .palet input {
    width: 100%; border: none; border-bottom: 1px solid var(--line); background: transparent;
    color: var(--text); font-family: "Source Serif 4", Georgia, serif; font-size: 1rem; padding: 0.75rem 0.95rem;
  }
  .palet input:focus { outline: none; }
  .palet ul { list-style: none; margin: 0; padding: 0.25rem; max-height: 52vh; overflow-y: auto; }
  .palet li {
    display: flex; align-items: baseline; gap: 0.5rem; padding: 0.42rem 0.7rem;
    border-radius: 7px; cursor: pointer; font-size: 0.92rem;
  }
  .palet li[aria-selected="true"] { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
  .palet li .pk { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; color: var(--muted); flex-shrink: 0; width: 3rem; }
  .palet li .pl { flex: 1; }
  .palet li .pr { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; color: var(--muted); }
  .palet .bos { padding: 0.9rem; color: var(--muted); font-size: 0.9rem; text-align: center; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 4.2rem; z-index: 80;
    background: var(--text); color: var(--bg); font-size: 0.86rem;
    padding: 0.5rem 0.9rem; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity 0.18s;
  }
  .toast.gor { opacity: 0.95; }
  .banner { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0.55rem 0.85rem; font-size: 0.86rem; color: var(--muted); margin: 0.7rem 0; }
  .banner.dikkat { border-color: var(--warn); }
  details.gh { margin: 1.4rem 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0.7rem 1rem; }
  details.gh summary { cursor: pointer; font-family: "Bricolage Grotesque", sans-serif; font-weight: 650; font-size: 0.95rem; }
  details.gh input[type=password] {
    width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--bg);
    color: var(--text); font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; padding: 0.45rem 0.6rem; margin: 0.4rem 0;
  }
  @media (prefers-reduced-motion: reduce) { *, .item.vurgu { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker"><a href="index.html" style="color:inherit;text-decoration:none">← atölye</a> · <a href="harita.html" style="color:inherit;text-decoration:none">harita</a> · seans defteri</p>
  <h1>Atölye Defteri</h1>
  <p class="lede">Veri kaynağı depodaki <code>durum.json</code>. Değişikliklerin önce tarayıcıda tutulur; <kbd>⌘K</kbd> ile her şeye ulaşır, <kbd>j</kbd>/<kbd>k</kbd> ile gezer, <kbd>0</kbd>–<kbd>4</kbd> ile basamak atarsın.</p>

  <div id="banner-alani"></div>
  <div class="ozet" id="ozet"></div>

  <div class="arac">
    <button class="dugme ikincil" id="btn-palet">⌘K komut paleti</button>
    <button class="dugme ikincil" id="btn-yeni">Yeni seans</button>
    <button class="dugme ikincil" id="btn-ac-kapa">Tümünü aç/kapa</button>
    <span class="ipucu" id="klavye-ipucu"><kbd>?</kbd> kısayollar</span>
  </div>

  <p class="legend" id="merdiven"></p>

  <div id="fazlar"></div>

  <h2 id="gunluk">Seans günlüğü</h2>
  <div class="jform" id="jform"></div>
  <div id="jliste"></div>

  <details class="gh" id="gh-kutu">
    <summary>⚙︎ Telefondan/tarayıcıdan doğrudan kaydetme (opsiyonel)</summary>
    <div id="gh-icerik"></div>
  </details>

  <p class="foot" id="altbilgi"></p>
</div>

<div class="kayitbar" id="kayitbar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="perde" id="perde"></div>
<div class="palet" id="palet" role="dialog" aria-modal="true" aria-label="Komut paleti">
  <input id="palet-arama" type="text" placeholder="madde, faz ya da komut ara…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palet-liste" aria-autocomplete="list">
  <ul id="palet-liste" role="listbox" aria-label="Sonuçlar"></ul>
</div>

<script src="./atolye.js"></script>
<script src="./github.js"></script>
<script src="./kanit.js"></script>
<script src="./defter.js"></script>
</body>
</html>
